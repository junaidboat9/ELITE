<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Admin – the_elitebloomery</title>
<style>
:root{--bg:#fffafb;--card:#fff;--ink:#3b2b30;--mute:#8b7279;--rose:#c26680;--blush:#fbe6ec;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#1c1417;--card:#291d21;--ink:#f7eaee;--mute:#bb9ea6;--blush:#35212a}}
*{box-sizing:border-box}body{margin:0 auto;background:var(--bg);color:var(--ink);font:14px/1.6 system-ui,sans-serif;padding:16px 16px 70px;max-width:760px}
h2{font-weight:600;margin:4px 0 12px}h3{margin:24px 0 8px;color:var(--rose);font-weight:500}label{display:block;font-size:12px;color:var(--mute);margin-bottom:8px}
input,select{font:inherit;width:100%;padding:8px 10px;border:1px solid var(--blush);border-radius:10px;background:var(--card);color:var(--ink)}
details{background:var(--card);border:1px solid var(--blush);border-radius:14px;padding:10px 14px;margin-bottom:10px}summary{cursor:pointer;font-weight:500}
button,.up{font:inherit;font-size:13px;border:0;border-radius:30px;padding:8px 18px;background:var(--rose);color:#fff;cursor:pointer;display:inline-block}button.g,.up{background:var(--blush);color:var(--rose)}
.row{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap}.row>*{flex:1 1 120px;width:auto}.row>button{flex:0 0 auto}.row img{flex:0 0 52px;width:52px;height:52px;object-fit:cover;border-radius:8px}
.bar{position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:2}#msg{font-size:13px;color:var(--mute);margin:6px 0;min-height:20px}
</style></head><body>
<h2>the_elitebloomery · Admin</h2>
<details id="cfg" open><summary>GitHub connection</summary><br>
<label>GitHub username<input id="o" autocomplete="off"></label><label>Repository name<input id="r" autocomplete="off"></label><label>Branch<input id="b" value="main"></label>
<label>Access token (fine-grained · only this repo · Contents: Read and write)<input id="t" type="password" autocomplete="off"></label><button id="cn">Connect</button></details>
<div id="msg"></div><div id="ed"></div>
<script>
var $=function(x){return document.querySelector(x)},esc=function(x){return String(x==null?"":x).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")},S=null,G={};
try{G=JSON.parse(localStorage.gh||"{}")}catch(e){}
["o","r","b","t"].forEach(function(k){if(G[k])$("#"+k).value=G[k]});
function msg(t){$("#msg").textContent=t}
function enc(t){return btoa(unescape(encodeURIComponent(t)))}function dec(b){return decodeURIComponent(escape(atob(b.replace(/\s/g,""))))}
function api(path,o){o=o||{};var u="https://api.github.com/repos/"+G.o+"/"+G.r+"/contents/"+path+(o.method?"":"?ref="+encodeURIComponent(G.b)+"&_="+Date.now());
return fetch(u,{method:o.method||"GET",body:o.body,cache:"no-store",headers:{Authorization:"Bearer "+G.t,Accept:"application/vnd.github+json"}}).then(function(r){return r.json().then(function(j){if(!r.ok){var e=new Error(j.message||r.status);e.status=r.status;throw e}return j})})}
$("#cn").onclick=async function(){G={o:$("#o").value.trim(),r:$("#r").value.trim(),b:$("#b").value.trim()||"main",t:$("#t").value.trim()};
try{localStorage.gh=JSON.stringify(G)}catch(e){}
msg("Connecting…");try{var r=await fetch("https://api.github.com/repos/"+G.o+"/"+G.r+"/contents/content.json?ref="+encodeURIComponent(G.b)+"&_="+Date.now(),{cache:"no-store",headers:{Authorization:"Bearer "+G.t,Accept:"application/vnd.github.raw+json"}});if(!r.ok)throw new Error((await r.json()).message||r.status);S=await r.json();msg("Connected ✓");$("#cfg").open=false;draw()}catch(e){S=null;draw();msg("Error: "+e.message)}};
var I={b:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="2.2"/><circle cx="12" cy="4.6" r="2"/><circle cx="12" cy="13.4" r="2"/><circle cx="7.6" cy="9" r="2"/><circle cx="16.4" cy="9" r="2"/><path d="M12 15.5V21M12 18c-2 0-3.5-1-4-2.5M12 19c2 0 3.5-1 4-2.5"/></svg>',n:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 12h7M9 15.5h7M9 8.5h3"/></svg>',r:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.6-7 10-7 10z"/></svg>',h:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="9" width="18" height="12" rx="1.5"/><path d="M2.5 9h19v-3h-19zM12 6v15M12 6c-1-3-5-3.5-5-1.5S10 6 12 6zM12 6c1-3 5-3.5 5-1.5S14 6 12 6z"/></svg>',w:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="12" rx="1.5"/><path d="M8 7.5h8M9.5 11h5M8 21l4-6 4 6M12 15v2"/></svg>',k:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5.5" r="2.7"/><path d="M12 8.2v3"/><path d="M12 11.2c3.2 0 5 2 5 4.6S15 21 12 21s-5-2.6-5-5.2 1.8-4.6 5-4.6z"/><circle cx="12" cy="16" r="1.4"/></svg>'};
var IL={b:"Bouquet",n:"Document",r:"Heart",h:"Gift box",w:"Board",k:"Keychain"};
function opts(a,v){return a.map(function(o){return '<option value="'+esc(o[0])+'"'+(o[0]==v?' selected':'')+'>'+esc(o[1])+'</option>'}).join("")}
function draw(){if(!S){$("#ed").innerHTML="";return}var s=S.site;
$("#ed").innerHTML='<div class="bar"><button id="sv">Save &amp; Publish</button></div><h3>Site details</h3>'+
[["name","Brand name"],["tag","Tagline"],["sub","Line under tagline"],["areas","Areas line"],["by","Footer line"],["ig","Instagram username"],["wa","WhatsApp number (e.g. 918766459663)"]].map(function(f){return '<label>'+f[1]+'<input data-s="'+f[0]+'" value="'+esc(s[f[0]])+'"></label>'}).join("")+
'<h3>Collection cards</h3>'+S.cats.map(function(c,n){var d=' data-l="cats" data-n="'+n+'"';return '<div class="row"><select'+d+' data-k="i">'+opts(Object.keys(IL).map(function(k){return [k,IL[k]]}),c.i)+'</select><input'+d+' data-k="t" value="'+esc(c.t)+'"><input'+d+' data-k="d" value="'+esc(c.d)+'"><button class="g" data-del="cats" data-n="'+n+'">✕</button></div>'}).join("")+'<button class="g" data-add="cats">+ Add card</button>'+
'<h3>Photo filters</h3><div class="row"><input id="nf" placeholder="New filter name"><button class="g" data-add="f">+ Add</button></div>'+
'<h3>Our Works photos ('+S.works.length+')</h3><label class="up">+ Add photos (unlimited)<input type="file" id="up" accept="image/*" multiple hidden></label> &nbsp; <select id="nc" style="width:auto">'+opts(S.filters.slice(1),NC||(S.filters[1]||[""])[0])+'</select> <small>← naye photos is category me jaenge</small><br><br>'+
S.works.map(function(w,n){var d=' data-l="works" data-n="'+n+'"';return '<div class="row"><img src="'+esc(w._p||w.s)+'"><input'+d+' data-k="t" value="'+esc(w.t)+'"><select'+d+' data-k="c">'+opts(S.filters.slice(1),w.c)+'</select><button class="g" data-del="works" data-n="'+n+'">✕</button></div>'}).join("")}
$("#ed").oninput=function(e){var t=e.target,d=t.dataset;if(d.s)S.site[d.s]=t.value;else if(d.l)S[d.l][d.n][d.k]=t.value;else if(t.id=="nc")NC=t.value};
$("#ed").onclick=function(e){var t=e.target.closest("button");if(!t)return;var d=t.dataset;
if(d.del)S[d.del].splice(d.n,1);else if(d.add=="cats")S.cats.push({i:"b",t:"New item",d:"Short description"});
else if(d.add=="f"){var v=$("#nf").value.trim(),k=v.toLowerCase().replace(/[^a-z0-9]+/g,"-");if(!k)return;S.filters.push([k,v])}
else if(t.id=="sv")return save();else return;draw()};
var NC="";function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
async function put(path,body){for(var t=0;t<6;t++){try{return await api(path,{method:"PUT",body:JSON.stringify(body)})}catch(e){if(e.status==403||e.status==429||/rate|abuse|secondary/i.test(e.message)){msg("GitHub rate limit — 60 sec ruk ke dobara…");await sleep(60000);continue}throw e}}throw new Error("GitHub rate limit, thodi der baad dobara try karo")}
async function saveContent(){for(var t=0;t<3;t++){try{var f=await api("content.json");await put("content.json",{message:"Update content",content:enc(JSON.stringify(S,function(k,v){return k[0]=="_"?undefined:v},1)),sha:f.sha,branch:G.b});return}catch(e){if(e.status==409||e.status==422){await sleep(1500);continue}throw e}}throw new Error("content.json save nahi hua")}
$("#ed").onchange=async function(e){if(e.target.id!="up")return;var fs=[].slice.call(e.target.files),n=0,bad=0,c=NC||(S.filters[1]?S.filters[1][0]:"all"),lab=(S.filters.filter(function(f){return f[0]==c})[0]||[0,"New photo"])[1];
for(var i=0;i<fs.length;i++){msg("Uploading photo "+(i+1)+"/"+fs.length+"… (tab band mat karna)");try{var u=await shrink(fs[i]),th=await shrink(fs[i],120),p="photos/"+Date.now()+"-"+i+".jpg";await put(p,{message:"Add photo",content:u.split(",")[1],branch:G.b});S.works.unshift({c:c,t:lab,s:p,_p:th});n++;if(n%10==0)try{await saveContent()}catch(z){}await sleep(700)}catch(x){bad++;msg("Photo "+(i+1)+" fail: "+x.message);await sleep(1500)}}
try{await saveContent();msg(n+" photos upload + save ✓"+(bad?" ("+bad+" fail hui, dobara try kar)":"")+" Website pe 1–2 min me dikhengi.")}catch(x){msg("Photos upload hui par content save fail: "+x.message+" — Save & Publish dabao.")}draw()};
async function shrink(f,m){var b=await createImageBitmap(f),r=Math.min(1,(m||1200)/Math.max(b.width,b.height)),c=document.createElement("canvas");c.width=Math.round(b.width*r);c.height=Math.round(b.height*r);c.getContext("2d").drawImage(b,0,0,c.width,c.height);return c.toDataURL("image/jpeg",.82)}
async function save(){try{S.works.forEach(function(w,i){var m=/^data:image\/(\w+);base64,([\s\S]+)$/.exec(w.s);if(m){w._d=m[2];w._p=w._p||w.s;w.s="photos/"+Date.now()+"-m"+i+"."+(m[1]=="jpeg"?"jpg":m[1])}});
var P=S.works.filter(function(w){return w._d});for(var i=0;i<P.length;i++){msg("Uploading old photo "+(i+1)+"/"+P.length+"…");await put(P[i].s,{message:"Add photo",content:P[i]._d,branch:G.b});delete P[i]._d;await sleep(700)}
msg("Saving content…");await saveContent();msg("Saved ✓ Website pe 1–2 min me dikhega.");draw()}catch(e){msg("Error: "+e.message+" — dobara Save dabao.")}}
</script></body></html>
